name: Monitor PS5

on:
  schedule:
    - cron: "7 * * * *"   # cada hora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-ps5
  cancel-in-progress: false

jobs:
  ps5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Revisar precios PS5
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m cazador.ps5
      - name: Guardar avisados
        run: |
          git config user.name "cazador-bot"
          git config user.email "cazador-bot@users.noreply.github.com"
          git add docs/ps5_vistos.json
          git diff --staged --quiet || (git commit -q -m "PS5: actualizar avisados" && for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done)
