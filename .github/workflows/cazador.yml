name: Cazador de figuras

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "23 12 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "normal, historico, diagnostico o prueba"
        default: normal

permissions:
  contents: write

concurrency:
  group: cazador-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar figuras
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOFISH_COOKIES: ${{ secrets.GOOFISH_COOKIES }}
        run: |
          git config user.name "cazador-bot"
          git config user.email "cazador-bot@users.noreply.github.com"
          guardar() {
            git add docs/data.json docs/debug 2>/dev/null || git add docs/data.json || true
            if ! git diff --staged --quiet; then
              git commit -q -m "Actualizar datos $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do
                git pull -q --rebase -X theirs && git push -q && break
                sleep 5
              done
            fi
          }
          MODO="${{ inputs.modo }}"
          if [ "${{ github.event.schedule }}" = "23 12 * * *" ]; then MODO=historico; fi
          MODO="${MODO:-normal}"
          if [ "$MODO" = "normal" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            VUELTAS=4    # turno automático: 4 revisiones, una cada 15 min
          else
            VUELTAS=1    # botón "buscar ahora": una sola revisión, al tiro
          fi
          for n in $(seq 1 $VUELTAS); do
            inicio=$(date +%s)
            python -m cazador.main --modo "$MODO" || true
            guardar
            if [ "$n" -lt "$VUELTAS" ]; then
              espera=$(( 900 - ($(date +%s) - inicio) ))
              [ $espera -gt 0 ] && sleep $espera
            fi
          done
