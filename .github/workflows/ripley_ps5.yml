name: Vigilar PS5 Ripley

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/ripley_ps5.yml"]

concurrency:
  group: vigilar-ripley-ps5
  cancel-in-progress: true

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vigilar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: America/Santiago
        run: python -u -m cazador.ripley_ps5
